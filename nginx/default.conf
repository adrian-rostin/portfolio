# Statische Auslieferung der vorgerenderten Angular-App.
# Datenschutz: keine Access-Logs, Fehlerlog nur für kritische Fehler.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log off;
    error_log /dev/stderr crit;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Gebündelte Dateien tragen einen Hash im Namen und dürfen dauerhaft gecacht werden
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(woff2?|png|webp|jpe?g|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Vorgerenderte Seiten (/, /impressum, /datenschutz), alles andere rendert der Client
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.csr.html;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }
}
