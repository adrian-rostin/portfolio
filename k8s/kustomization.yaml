apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Die Pipeline setzt hier den Commit-SHA des frisch gebauten Images ein.
images:
  - name: ghcr.io/adrian-rostin/portfolio
    newTag: latest
